# Honcho self-hosted — hardened compose for Dokploy (internal-only).
#
# Differences vs upstream docker-compose.yml.example:
#   - Prebuilt pinned image (no source build)
#   - AUTH_USE_AUTH=true + JWT secret (no passwordless anything)
#   - Strong POSTGRES_PASSWORD; POSTGRES_HOST_AUTH_METHOD=trust REMOVED
#   - ZERO published ports (no ports: blocks at all)
#   - api joins external dokploy-network with stable alias "honcho-api"
#   - OpenRouter for all LLM + embeddings (cheap pinned tiers)
#   - Telemetry off
#
# Secrets are injected by Dokploy's env field via ${} interpolation:
#   POSTGRES_PASSWORD, AUTH_JWT_SECRET, OPENROUTER_API_KEY

# NOTE: ghcr has no usable semver tags for the v3 API (v2.0.3 is the old v2
# schema, lacks docker/entrypoint.sh and MODEL_CONFIG__* env vars). We pin
# `latest` BY DIGEST (multi-arch index) — immutable, matches main's v3 config.
# To update: fetch the new index digest for tag `latest` via the ghcr token
# flow (see README), bump both image lines, commit, redeploy.
x-honcho-image: &honcho-image ghcr.io/plastic-labs/honcho@sha256:790e186a0e97cd03cc505b4d737f9fde2afc8d04a1bcfbd8994e2962e8815f1f

services:
  api:
    image: *honcho-image
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@database:5432/postgres
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      - AUTH_USE_AUTH=true
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - LLM_OPENAI_API_KEY=${OPENROUTER_API_KEY}
      - TELEMETRY_ENABLED=false
      - VECTOR_STORE_TYPE=pgvector
      # Embeddings via OpenRouter (OpenAI-compatible endpoint)
      - EMBED_MESSAGES=true
      - EMBEDDING_VECTOR_DIMENSIONS=1536
      - EMBEDDING_MODEL_CONFIG__TRANSPORT=openai
      - EMBEDDING_MODEL_CONFIG__MODEL=openai/text-embedding-3-small
      - EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      # Deriver — cheap tier
      - DERIVER_MODEL_CONFIG__TRANSPORT=openai
      - DERIVER_MODEL_CONFIG__MODEL=google/gemini-2.5-flash-lite
      - DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      # Summary — cheap tier
      - SUMMARY_MODEL_CONFIG__TRANSPORT=openai
      - SUMMARY_MODEL_CONFIG__MODEL=google/gemini-2.5-flash-lite
      - SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      # Dream — cheap tier
      - DREAM_DEDUCTION_MODEL_CONFIG__TRANSPORT=openai
      - DREAM_DEDUCTION_MODEL_CONFIG__MODEL=google/gemini-2.5-flash-lite
      - DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DREAM_INDUCTION_MODEL_CONFIG__TRANSPORT=openai
      - DREAM_INDUCTION_MODEL_CONFIG__MODEL=google/gemini-2.5-flash-lite
      - DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      # Dialectic — cheap tier for light levels, stronger for deep levels
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL=google/gemini-2.5-flash-lite
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL=google/gemini-2.5-flash-lite
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__medium__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL=google/gemini-2.5-flash
      - DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__high__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL=google/gemini-2.5-flash
      - DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__max__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL=google/gemini-2.5-flash
      - DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
    networks:
      internal:
      dokploy-network:
        aliases:
          - honcho-api
      hermes-net:
        aliases:
          - honcho-api
    mem_limit: 2g
    restart: unless-stopped

  deriver:
    image: *honcho-image
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      api:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@database:5432/postgres
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      - AUTH_USE_AUTH=true
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - LLM_OPENAI_API_KEY=${OPENROUTER_API_KEY}
      - TELEMETRY_ENABLED=false
      - VECTOR_STORE_TYPE=pgvector
      - EMBED_MESSAGES=true
      - EMBEDDING_VECTOR_DIMENSIONS=1536
      - EMBEDDING_MODEL_CONFIG__TRANSPORT=openai
      - EMBEDDING_MODEL_CONFIG__MODEL=openai/text-embedding-3-small
      - EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DERIVER_MODEL_CONFIG__TRANSPORT=openai
      - DERIVER_MODEL_CONFIG__MODEL=google/gemini-2.5-flash-lite
      - DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - SUMMARY_MODEL_CONFIG__TRANSPORT=openai
      - SUMMARY_MODEL_CONFIG__MODEL=google/gemini-2.5-flash-lite
      - SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DREAM_DEDUCTION_MODEL_CONFIG__TRANSPORT=openai
      - DREAM_DEDUCTION_MODEL_CONFIG__MODEL=google/gemini-2.5-flash-lite
      - DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DREAM_INDUCTION_MODEL_CONFIG__TRANSPORT=openai
      - DREAM_INDUCTION_MODEL_CONFIG__MODEL=google/gemini-2.5-flash-lite
      - DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL=google/gemini-2.5-flash-lite
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL=google/gemini-2.5-flash-lite
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__medium__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL=google/gemini-2.5-flash
      - DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__high__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL=google/gemini-2.5-flash
      - DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__max__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL=google/gemini-2.5-flash
      - DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
    networks:
      - internal
    restart: unless-stopped

  database:
    image: pgvector/pgvector:pg15
    mem_limit: 1g
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:8.2
    mem_limit: 512m
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  pgdata:
  redis-data:

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
  # Per-app bridge network of the "Hermes - Kiarash" Dokploy stack. This
  # Dokploy version isolates every compose app on its own network (traefik
  # joins each for routing), so the swarm-overlay dokploy-network alone is
  # NOT enough for the Hermes container to reach us. Add future agents'
  # app networks here the same way.
  hermes-net:
    external: true
    name: hermes-hermes-rvc5ww
